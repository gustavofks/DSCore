name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same toolchain image as tools/dk.ps1.
      - name: Build toolchain image
        run: docker build -t dscore-dev .

      - name: Host tests
        run: docker run --rm -v "$PWD:/project" -w /project dscore-dev make -C tests

      - name: Build dscore.nds and the release zip
        run: docker run --rm -v "$PWD:/project" -w /project dscore-dev make dist

      - uses: actions/upload-artifact@v4
        with:
          name: dscore
          path: dist/*.zip
